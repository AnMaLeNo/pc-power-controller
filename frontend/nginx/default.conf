server {
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events: pas de buffering sur le flux /api/events.
    # proxy_read_timeout borne le temps qu'une connexion zombie (client parti
    # sans fermeture propre) peut squatter une ressource. 1h suffit largement :
    # le heartbeat SSE (cf. API) réémet du trafic toutes les 30s, donc une
    # connexion vivante ne le déclenche jamais.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
