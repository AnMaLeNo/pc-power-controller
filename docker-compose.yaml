services:
  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    container_name: mqtt_broker
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    networks:
      - iot_net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -i healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s

  api:
    build:
      context: ./power-pc-api
      target: production
    container_name: power_api
    restart: always
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - iot_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: power_frontend
    restart: always
    ports:
      - "18080:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - iot_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s

networks:
  iot_net:
    driver: bridge
