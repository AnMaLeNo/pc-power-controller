services:
  api:
    build:
      context: ./power-pc-api
      target: production
    container_name: power_api
    restart: always
    environment:
      # Le broker MQTT est une infrastructure partagée du Raspberry (repo
      # ~/mosquitto), hors de ce compose. host.docker.internal pointe vers
      # l'hôte (cf. extra_hosts), où Mosquitto publie le port 1883.
      # Surchargeable via un fichier .env (MQTT_HOST=..., MQTT_PORT=...).
      - MQTT_HOST=${MQTT_HOST:-host.docker.internal}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - PORT=3000
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iot_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: power_frontend
    restart: always
    ports:
      - "18080:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - iot_net
    healthcheck:
      # IP littérale (et non "localhost") pour un check déterministe : localhost peut résoudre ::1 d'abord, que busybox wget n'essaie pas en fallback.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s

networks:
  iot_net:
    driver: bridge
